<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Testimonial Template</title>
  <style>
    :root {
      --primary-color: #1a1a2e;
      --secondary-color: #f8f8f8;
      --accent-color: #e52d2e;
      --font-name: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px; height: 1350px;
      font-family: var(--font-name), sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 80px; position: relative; overflow: hidden;
      background-color: #000;
    }
    .background-img {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 1;
    }
    /* TESTIMONIAL-specific: strong blurred dark overlay to make card pop */
    .gradient-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      z-index: 2;
    }
    .logo-container {
      position: absolute;
      display: flex; align-items: center; gap: 12px;
      font-weight: 800; font-size: 24px;
      letter-spacing: 0.05em; z-index: 10;
    }
    .logo-text { text-transform: uppercase; }
    .position-top-left    { top: 60px; left: 60px; }
    .position-top-right   { top: 60px; right: 60px; }
    .position-bottom-left { bottom: 60px; left: 60px; }
    .position-bottom-right{ bottom: 60px; right: 60px; }

    /* TESTIMONIAL-specific: white card floating in the center with drop shadow */
    .testimonial-card {
      position: relative; z-index: 3;
      background-color: var(--secondary-color);
      color: var(--primary-color);
      width: 100%; max-width: 820px;
      border-radius: 24px;
      padding: 60px 50px;
      display: flex; flex-direction: column;
      align-items: center; text-align: center; gap: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border-top: 8px solid var(--accent-color);
    }
    .stars-row {
      display: flex; gap: 8px;
      color: var(--accent-color); font-size: 36px;
    }
    .testimonial-text {
      font-size: 34px; font-style: italic;
      line-height: 1.55; font-weight: 500;
    }
    .testimonial-author {
      font-size: 22px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--accent-color);
    }
  </style>
</head>
<body>
  <img id="image-slot" class="background-img" src="" alt="Testimonial Background">
  <div class="gradient-overlay"></div>

  <div id="logo-slot" class="logo-container position-top-right">
    <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
    </svg>
    <span class="logo-text">Brand</span>
  </div>

  <div class="testimonial-card">
    <div class="stars-row">
      <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
    </div>
    <p id="text-slot" class="testimonial-text">„Vásárlói vélemény szövege helye."</p>
    <p id="cta-slot" class="testimonial-author">Vásárló neve</p>
  </div>
</body>
</html>
