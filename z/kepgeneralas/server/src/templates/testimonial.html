<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Testimonial Template</title>
  <style>
    :root {
      --primary-color: #3E2723;
      --secondary-color: #F5F5DC;
      --accent-color: #FF8F00;
      --font-name: 'Montserrat', sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1350px;
      font-family: var(--font-name), sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
      position: relative;
      overflow: hidden;
      background-color: #000;
    }
    .background-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .gradient-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(5px);
      z-index: 2;
    }

    /* Logo Slot */
    .logo-container {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: 0.05em;
      z-index: 3;
    }
    .logo-text {
      text-transform: uppercase;
    }
    .position-top-left { top: 60px; left: 60px; }
    .position-top-right { top: 60px; right: 60px; }
    .position-bottom-left { bottom: 60px; left: 60px; }
    .position-bottom-right { bottom: 60px; right: 60px; }

    /* Testimonial Card container */
    .testimonial-card {
      position: relative;
      z-index: 3;
      background-color: var(--secondary-color);
      color: var(--primary-color);
      width: 100%;
      max-width: 820px;
      border-radius: 24px;
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 30px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.4);
    }
    .stars-row {
      display: flex;
      gap: 8px;
      color: var(--accent-color);
      font-size: 36px;
    }
    .testimonial-text {
      font-size: 34px;
      font-style: italic;
      line-height: 1.55;
      font-weight: 500;
    }
    .testimonial-author {
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-color);
    }
  </style>
</head>
<body>
  <!-- Background image -->
  <img id="image-slot" class="background-img" src="" alt="Testimonial Background">
  <div class="gradient-overlay"></div>

  <!-- Logo Slot -->
  <div id="logo-slot" class="logo-container position-top-right">
    <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 8h1a4 4 0 1 1 0 8h-1" />
      <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" />
    </svg>
    <span class="logo-text">Brand</span>
  </div>

  <!-- Testimonial content card -->
  <div class="testimonial-card">
    <div class="stars-row">
      <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
    </div>
    <p id="text-slot" class="testimonial-text">„A legfinomabb szezonális kávé, amit Budapesten ittam! Az eper és a csoki ízjegyei tökéletesen kiegészítik egymást, a hangulat pedig csodás.”</p>
    <p id="cta-slot" class="testimonial-author">Kovács Anna, Törzsvendég</p>
  </div>
</body>
</html>
