<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Quote Template</title>
  <style>
    :root {
      --primary-color: #1a1a2e;
      --secondary-color: #f8f8f8;
      --accent-color: #e52d2e;
      --font-name: 'Playfair Display', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px; height: 1350px;
      font-family: var(--font-name), sans-serif;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 80px; position: relative; overflow: hidden;
      background-color: #000;
    }
    .background-img {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 1;
    }
    /* QUOTE-specific: diagonal colored stripe overlay + dark tint */
    .gradient-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0.65) 100%);
      z-index: 2;
    }
    /* QUOTE-specific: large vertical colored bar on the left side */
    .accent-bar {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 14px;
      background-color: var(--accent-color);
      z-index: 4;
    }
    .logo-container {
      position: absolute;
      display: flex; align-items: center; gap: 12px;
      font-weight: 800; font-size: 24px;
      letter-spacing: 0.05em; z-index: 10;
    }
    .logo-text { text-transform: uppercase; }
    .position-top-left    { top: 60px; left: 60px; }
    .position-top-right   { top: 60px; right: 60px; }
    .position-bottom-left { bottom: 60px; left: 60px; }
    .position-bottom-right{ bottom: 60px; right: 60px; }

    /* QUOTE content — centered, italic, large quotation mark */
    .quote-content {
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
      gap: 40px; width: 100%; max-width: 900px;
      z-index: 3; position: relative;
    }
    .quote-mark {
      font-size: 180px; line-height: 0.1;
      font-family: 'Playfair Display', serif;
      color: var(--accent-color);
      margin-bottom: -40px;
    }
    .quote-text {
      font-size: 44px; font-style: italic;
      line-height: 1.6; font-weight: 500;
      color: var(--secondary-color);
    }
    .quote-divider {
      width: 120px; height: 6px;
      background-color: var(--accent-color);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <img id="image-slot" class="background-img" src="" alt="Quote Background">
  <div class="gradient-overlay"></div>
  <div class="accent-bar"></div>

  <div id="logo-slot" class="logo-container position-top-right">
    <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
    </svg>
    <span class="logo-text">Brand</span>
  </div>

  <div class="quote-content">
    <span class="quote-mark">"</span>
    <p id="text-slot" class="quote-text">Idézet szöveg helye.</p>
    <div class="quote-divider"></div>
  </div>
</body>
</html>
