<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Quote Template</title>
  <style>
    :root {
      --primary-color: #5C4033;
      --secondary-color: #E8DCC4;
      --accent-color: #D2691E;
      --font-name: 'Playfair Display', serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1350px;
      background-color: var(--primary-color);
      color: var(--secondary-color);
      font-family: var(--font-name), sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px;
      position: relative;
      overflow: hidden;
    }
    /* Logo Slot styling */
    .logo-container {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: 0.05em;
    }
    .logo-text {
      text-transform: uppercase;
    }
    .position-top-left { top: 60px; left: 60px; }
    .position-top-right { top: 60px; right: 60px; }
    .position-bottom-left { bottom: 60px; left: 60px; }
    .position-bottom-right { bottom: 60px; right: 60px; }

    .quote-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 40px;
      width: 100%;
      max-width: 900px;
    }
    .quote-mark {
      font-size: 180px;
      line-height: 0.1;
      font-family: 'Playfair Display', serif;
      color: var(--accent-color);
      margin-bottom: -40px;
    }
    .quote-text {
      font-size: 44px;
      font-style: italic;
      line-height: 1.6;
      font-weight: 500;
    }
    .quote-divider {
      width: 120px;
      height: 6px;
      background-color: var(--accent-color);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <!-- Logo Slot -->
  <div id="logo-slot" class="logo-container position-top-right">
    <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" />
    </svg>
    <span class="logo-text">Brand</span>
  </div>

  <!-- Main Quote Container -->
  <div class="quote-content">
    <span class="quote-mark">“</span>
    <p id="text-slot" class="quote-text">A tavasz a természet ébredése, a kávé pedig a miénk.</p>
    <div class="quote-divider"></div>
  </div>
</body>
</html>
