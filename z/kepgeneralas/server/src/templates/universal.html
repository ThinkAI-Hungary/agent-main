<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Universal Template</title>
  <style>
    :root {
      --primary-color: #3E2723;
      --secondary-color: #F5F5DC;
      --accent-color: #FF8F00;
      --font-name: 'Montserrat', sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1350px;
      font-family: var(--font-name), sans-serif;
      position: relative;
      overflow: hidden;
      background-color: #000;
    }
    .background-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Subtle gradient vignette for logo readability */
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.25) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Logo Slot */
    .logo-container {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.06em;
      z-index: 10;
      text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    }
    .logo-text {
      text-transform: uppercase;
    }
    .position-top-left { top: 48px; left: 48px; }
    .position-top-right { top: 48px; right: 48px; }
    .position-bottom-left { bottom: 48px; left: 48px; }
    .position-bottom-right { bottom: 48px; right: 48px; }
  </style>
</head>
<body>
  <!-- Full-bleed background image (Flux-generated with text baked in) -->
  <img id="image-slot" class="background-img" src="" alt="Campaign Creative">
  <div class="vignette-overlay"></div>

  <!-- Logo watermark (only overlay element) -->
  <div id="logo-slot" class="logo-container position-top-left">
    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 8h1a4 4 0 1 1 0 8h-1" />
      <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" />
    </svg>
    <span class="logo-text">Brand</span>
  </div>
</body>
</html>
